<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>MP 영역 선택</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100vw;
        height: 100vh;
        background: rgba(5, 8, 10, 0.4);
        cursor: crosshair;
        user-select: none;
        overflow: hidden;
        font-family: 'JetBrains Mono', 'Nanum Gothic Coding', Consolas, monospace;
      }
      body.adjust-mode { cursor: default; }
      #info {
        position: fixed;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        color: #00ff9f;
        font-size: 14px;
        font-weight: 700;
        background: rgba(5, 8, 10, 0.94);
        padding: 12px 18px;
        border-radius: 8px;
        border: 1px solid #00ff9f;
        box-shadow: 0 0 20px rgba(0, 255, 159, 0.4);
        pointer-events: none;
        z-index: 100;
        letter-spacing: 0.04em;
        line-height: 1.6;
        max-width: 720px;
        text-align: center;
      }
      #info b { color: #ffd84a; }
      #info small {
        color: #9dc4b3;
        font-size: 11px;
        font-weight: 400;
        display: block;
        margin-top: 4px;
      }
      #selection {
        position: fixed;
        border: 2px solid #00ff9f;
        background: rgba(0, 255, 159, 0.12);
        box-shadow: 0 0 12px rgba(0, 255, 159, 0.6),
                    inset 0 0 12px rgba(0, 255, 159, 0.2);
        pointer-events: none;
        display: none;
      }
      #selection.adjust {
        border-style: dashed;
        border-color: #ffd84a;
        background: rgba(255, 216, 74, 0.10);
        box-shadow: 0 0 16px rgba(255, 216, 74, 0.6),
                    inset 0 0 12px rgba(255, 216, 74, 0.2);
      }
      #coords {
        position: absolute;
        bottom: -28px;
        right: 0;
        background: rgba(5, 8, 10, 0.94);
        color: #00ff9f;
        font-size: 12px;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 3px;
        white-space: nowrap;
        border: 1px solid #00ff9f;
      }
      #selection.adjust #coords { color: #ffd84a; border-color: #ffd84a; }
      #cross-h, #cross-v {
        position: fixed;
        background: rgba(0, 255, 159, 0.3);
        pointer-events: none;
        display: none;
      }
      #cross-h { left: 0; right: 0; height: 1px; }
      #cross-v { top: 0; bottom: 0; width: 1px; }
      .handle {
        position: absolute;
        width: 8px;
        height: 8px;
        background: #ffd84a;
        border: 1px solid #000;
        pointer-events: none;
      }
      .handle.tl { top: -5px; left: -5px; }
      .handle.tr { top: -5px; right: -5px; }
      .handle.bl { bottom: -5px; left: -5px; }
      .handle.br { bottom: -5px; right: -5px; }

      /* Loupe (확대 돋보기) */
      #loupe-container {
        position: fixed;
        z-index: 150;
        pointer-events: none;
        display: none;
        background: rgba(5, 8, 10, 0.94);
        border: 2px solid #00ff9f;
        box-shadow: 0 0 16px rgba(0, 255, 159, 0.5);
        border-radius: 4px;
        padding: 4px;
      }
      #loupe-canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #loupe-info {
        font-size: 10px;
        color: #00ff9f;
        text-align: center;
        margin-top: 4px;
        font-weight: 700;
      }
      video#loupe-video { display: none; }
    </style>
  </head>
  <body>
    <div id="info">
      <span id="info-msg">📷 영역을 드래그로 선택하세요</span>
      <small><b>L</b> 루페 source 변경 · <b>Esc</b> 취소</small>
    </div>
    <div id="cross-h"></div>
    <div id="cross-v"></div>
    <div id="selection">
      <div id="coords">0×0</div>
      <div class="handle tl"></div>
      <div class="handle tr"></div>
      <div class="handle bl"></div>
      <div class="handle br"></div>
    </div>

    <video id="loupe-video" muted autoplay playsinline></video>
    <div id="loupe-container">
      <canvas id="loupe-canvas" width="280" height="200"></canvas>
      <div id="loupe-info" id="loupe-zoom-info">5x 확대 · 마우스 주변</div>
    </div>

    <script>
      let startX = 0, startY = 0, isDragging = false;
      let region = null;
      let mouseX = 0, mouseY = 0;
      const sel = document.getElementById('selection');
      const coords = document.getElementById('coords');
      const crossH = document.getElementById('cross-h');
      const crossV = document.getElementById('cross-v');
      const info = document.getElementById('info');
      const loupeContainer = document.getElementById('loupe-container');
      const loupe = document.getElementById('loupe-canvas');
      const loupeInfo = document.getElementById('loupe-info');
      const lctx = loupe.getContext('2d');
      const video = document.getElementById('loupe-video');

      const ZOOM = 5;
      const SRC_W = Math.round(loupe.width / ZOOM);   // 280/5 = 56
      const SRC_H = Math.round(loupe.height / ZOOM);  // 200/5 = 40
      let videoReady = false;

      function applyRegion(r) {
        sel.style.left = r.x + 'px';
        sel.style.top = r.y + 'px';
        sel.style.width = r.width + 'px';
        sel.style.height = r.height + 'px';
        coords.textContent = `${r.x}, ${r.y} · ${r.width}×${r.height}`;
      }

      function enterAdjustMode() {
        document.body.classList.add('adjust-mode');
        sel.classList.add('adjust');
        crossH.style.display = 'none';
        crossV.style.display = 'none';
        info.innerHTML = `
          🟡 <b>미세 조정 모드</b> &nbsp;|&nbsp; 영역: <b>${region.width}×${region.height}</b>
          <small>
            <b>화살표</b> 위치 이동 &nbsp;·&nbsp;
            <b>Shift+화살표</b> 우/하 크기 조정 &nbsp;·&nbsp;
            <b>Alt+화살표</b> 좌/상 크기 조정 &nbsp;·&nbsp;
            <b>Enter</b> 확정 &nbsp;·&nbsp;
            <b>Esc</b> 취소 &nbsp;·&nbsp;
            드래그로 다시 그리기
          </small>
        `;
      }

      function exitAdjustMode() {
        document.body.classList.remove('adjust-mode');
        sel.classList.remove('adjust');
        region = null;
      }

      // ---------- Loupe (확대 미리보기) ----------
      // 모든 source 후보 + 현재 인덱스 — 'L' 키로 사이클 가능
      const allSources = (window.overlayApi && window.overlayApi.getLoupeAllSources)
        ? window.overlayApi.getLoupeAllSources() : [];
      const initialSourceId = (window.overlayApi && window.overlayApi.getLoupeSourceId)
        ? window.overlayApi.getLoupeSourceId() : '';
      let currentSourceIdx = Math.max(0, allSources.findIndex((s) => s.id === initialSourceId));
      let currentStream = null;

      function updateSourceIndicator() {
        const infoEl = document.getElementById('info-msg');
        if (!infoEl || allSources.length === 0) return;
        const cur = allSources[currentSourceIdx] || {};
        infoEl.innerHTML = '📷 영역을 드래그로 선택하세요 · ' +
          '<span style="color:#ffd84a">루페 source ' + (currentSourceIdx + 1) + '/' + allSources.length +
          ' (' + (cur.w || '?') + '×' + (cur.h || '?') + ')</span> — 위치 어긋나면 <b>L</b>로 다음 source';
      }

      async function startLoupeWithSource(sourceId) {
        const expected = (window.overlayApi && window.overlayApi.getLoupeExpected)
          ? window.overlayApi.getLoupeExpected() : { w: 0, h: 0 };
        console.log('[Loupe] start', {
          sourceId,
          idx: currentSourceIdx + '/' + allSources.length,
          expected,
          windowInner: { w: window.innerWidth, h: window.innerHeight },
          devicePixelRatio: window.devicePixelRatio
        });
        if (!sourceId) {
          console.warn('[Loupe] sourceId 없음, 비활성');
          return;
        }
        // 기존 stream 정리
        if (currentStream) {
          try { currentStream.getTracks().forEach((t) => t.stop()); } catch (_) {}
          currentStream = null;
        }
        videoReady = false;
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              mandatory: {
                chromeMediaSource: 'desktop',
                chromeMediaSourceId: sourceId,
                minWidth: 1, maxWidth: 4096,
                minHeight: 1, maxHeight: 2160
              }
            }
          });
          currentStream = stream;
          video.srcObject = stream;
          await new Promise((res) => {
            video.onloadedmetadata = () => {
              console.log('[Loupe] video metadata', {
                videoSize: { w: video.videoWidth, h: video.videoHeight },
                expected
              });
              res();
            };
          });
          await video.play();
          videoReady = true;
          loupeContainer.style.display = 'block';
          updateSourceIndicator();
          requestAnimationFrame(renderLoupe);
        } catch (e) {
          console.error('[Loupe] start failed:', e);
        }
      }

      async function cycleLoupeSource() {
        if (allSources.length < 2) return;
        currentSourceIdx = (currentSourceIdx + 1) % allSources.length;
        const next = allSources[currentSourceIdx];
        console.log('[Loupe] cycle →', currentSourceIdx, next);
        await startLoupeWithSource(next.id);
      }

      async function startLoupe() {
        const sid = allSources.length > 0 ? allSources[currentSourceIdx].id : initialSourceId;
        await startLoupeWithSource(sid);
      }

      function renderLoupe() {
        if (!videoReady || !video.videoWidth || !video.videoHeight) {
          requestAnimationFrame(renderLoupe);
          return;
        }
        // 비디오 해상도 vs 윈도우 해상도 비율 — 듀얼 모니터·DPI 고려
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        const ww = window.innerWidth || 1;
        const wh = window.innerHeight || 1;
        // mouseX/Y는 logical(window) px, video는 physical px → 비율로 변환
        const sx = (mouseX / ww) * vw - SRC_W / 2;
        const sy = (mouseY / wh) * vh - SRC_H / 2;
        const sxClamped = Math.max(0, Math.min(vw - SRC_W, sx));
        const syClamped = Math.max(0, Math.min(vh - SRC_H, sy));
        lctx.imageSmoothingEnabled = false;
        lctx.fillStyle = '#000';
        lctx.fillRect(0, 0, loupe.width, loupe.height);
        try {
          lctx.drawImage(video, sxClamped, syClamped, SRC_W, SRC_H, 0, 0, loupe.width, loupe.height);
        } catch (_) { /* video not ready */ }
        // 중심 십자선 (마우스 정확한 위치)
        lctx.strokeStyle = 'rgba(255, 50, 50, 0.7)';
        lctx.lineWidth = 1;
        lctx.beginPath();
        lctx.moveTo(loupe.width / 2, 0); lctx.lineTo(loupe.width / 2, loupe.height);
        lctx.moveTo(0, loupe.height / 2); lctx.lineTo(loupe.width, loupe.height / 2);
        lctx.stroke();
        requestAnimationFrame(renderLoupe);
      }

      function placeLoupe(mx, my) {
        const margin = 30;
        let lx = mx + margin;
        let ly = my + margin;
        const lw = loupeContainer.offsetWidth || (loupe.width + 8);
        const lh = loupeContainer.offsetHeight || (loupe.height + 28);
        // 화면 우/하 끝 가까우면 반대쪽으로
        if (lx + lw > window.innerWidth) lx = mx - margin - lw;
        if (ly + lh > window.innerHeight) ly = my - margin - lh;
        if (lx < 0) lx = 0;
        if (ly < 0) ly = 0;
        loupeContainer.style.left = lx + 'px';
        loupeContainer.style.top = ly + 'px';
      }
      // -------------------------------------------

      document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        placeLoupe(mouseX, mouseY);
        if (region) return; // 미세 조정 모드에선 영역 변경 안 함
        if (!isDragging) {
          crossH.style.display = 'block';
          crossV.style.display = 'block';
          crossH.style.top = e.clientY + 'px';
          crossV.style.left = e.clientX + 'px';
          return;
        }
        const x = Math.min(e.clientX, startX);
        const y = Math.min(e.clientY, startY);
        const w = Math.abs(e.clientX - startX);
        const h = Math.abs(e.clientY - startY);
        applyRegion({ x, y, width: w, height: h });
      });

      document.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        if (region) exitAdjustMode();
        startX = e.clientX;
        startY = e.clientY;
        isDragging = true;
        crossH.style.display = 'none';
        crossV.style.display = 'none';
        sel.style.display = 'block';
        applyRegion({ x: startX, y: startY, width: 0, height: 0 });
      });

      document.addEventListener('mouseup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        const x = Math.min(e.clientX, startX);
        const y = Math.min(e.clientY, startY);
        const w = Math.abs(e.clientX - startX);
        const h = Math.abs(e.clientY - startY);
        if (w >= 4 && h >= 4) {
          region = { x, y, width: w, height: h };
          applyRegion(region);
          enterAdjustMode();
        } else {
          sel.style.display = 'none';
        }
      });

      function adjust(dx, dy, resizeFromBR, resizeFromTL) {
        if (!region) return;
        if (resizeFromBR) {
          region.width = Math.max(2, region.width + dx);
          region.height = Math.max(2, region.height + dy);
        } else if (resizeFromTL) {
          region.x += dx;
          region.y += dy;
          region.width = Math.max(2, region.width - dx);
          region.height = Math.max(2, region.height - dy);
        } else {
          region.x += dx;
          region.y += dy;
        }
        applyRegion(region);
        const sizeBold = info.querySelector('b');
        if (sizeBold) sizeBold.textContent = region.width + '×' + region.height;
      }

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          window.overlayApi.cancel();
          return;
        }
        // 'L' 또는 'l' — 루페 source 사이클 (멀티 모니터 매칭 실패 시 수동 선택)
        if (e.key === 'l' || e.key === 'L') {
          e.preventDefault();
          cycleLoupeSource();
          return;
        }
        if (region) {
          if (e.key === 'Enter') {
            e.preventDefault();
            window.overlayApi.confirm(region);
            return;
          }
          let dx = 0, dy = 0;
          if (e.key === 'ArrowLeft') dx = -1;
          else if (e.key === 'ArrowRight') dx = 1;
          else if (e.key === 'ArrowUp') dy = -1;
          else if (e.key === 'ArrowDown') dy = 1;
          else return;
          e.preventDefault();
          adjust(dx, dy, e.shiftKey, e.altKey);
        }
      });

      // 시작
      startLoupe();
    </script>
  </body>
</html>
