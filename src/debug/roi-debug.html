<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>ROI Detector Debug — Lineage MP Timer v1.4.0</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #1a1a1a; color: #d8d8d8;
      font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
      font-size: 13px;
    }
    .layout {
      display: flex; height: 100vh; width: 100vw;
    }
    .preview-pane {
      flex: 0 0 70%; padding: 12px;
      display: flex; flex-direction: column;
      border-right: 1px solid #2a2a2a;
      overflow: hidden;
    }
    .controls-pane {
      flex: 0 0 30%; padding: 12px;
      overflow-y: auto;
      background: #161616;
    }
    h1 {
      font-size: 14px; margin: 0 0 8px 0;
      color: #39ff14; letter-spacing: 0.5px;
    }
    h2 {
      font-size: 12px; margin: 12px 0 6px 0;
      color: #39ff14; letter-spacing: 0.3px;
      text-transform: uppercase;
    }
    .drop-zone {
      flex: 1; min-height: 200px;
      border: 2px dashed #39ff14;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
      background: #0d0d0d;
    }
    .drop-zone.has-image { border-style: solid; border-color: #2a4a2a; }
    .drop-zone .hint {
      color: #666; pointer-events: none;
      text-align: center; line-height: 1.6;
    }
    .drop-zone canvas {
      max-width: 100%; max-height: 100%;
      display: block;
    }
    .status-bar {
      margin-top: 8px;
      padding: 6px 10px;
      background: #0d0d0d;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      font-family: Consolas, monospace;
      font-size: 11px;
      color: #aaa;
      min-height: 22px;
    }
    .status-bar.valid { color: #39ff14; border-color: #2a4a2a; }
    .status-bar.invalid { color: #ff5555; border-color: #4a2a2a; }
    .group {
      margin-bottom: 14px;
      padding: 8px;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      background: #0d0d0d;
    }
    .group-title {
      font-weight: bold; color: #39ff14;
      margin-bottom: 6px; font-size: 12px;
      display: flex; justify-content: space-between;
    }
    .group-title .badge {
      font-size: 10px; padding: 1px 6px;
      border-radius: 8px; font-weight: normal;
    }
    .badge.ok { background: #1a3a1a; color: #39ff14; }
    .badge.fail { background: #3a1a1a; color: #ff5555; }
    .slider-row {
      display: grid;
      grid-template-columns: 60px 1fr 50px;
      align-items: center;
      gap: 6px;
      margin: 4px 0;
      font-size: 11px;
    }
    .slider-row label { color: #888; }
    .slider-row input[type=range] {
      width: 100%;
      accent-color: #39ff14;
    }
    .slider-row .val {
      font-family: Consolas, monospace;
      color: #39ff14; text-align: right;
    }
    button.action {
      background: #1a1a1a; border: 1px solid #39ff14;
      color: #39ff14; padding: 6px 12px; cursor: pointer;
      border-radius: 3px; font-size: 11px; margin: 4px 4px 4px 0;
    }
    button.action:hover { background: #1a3a1a; }
    pre.json {
      background: #0d0d0d; border: 1px solid #2a2a2a;
      padding: 8px; border-radius: 4px;
      font-size: 10px; color: #aaa;
      max-height: 240px; overflow: auto;
      white-space: pre-wrap; word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="layout">
    <div class="preview-pane">
      <h1>🎯 ROI Detector Debug — v1.4.0</h1>
      <div id="dropzone" class="drop-zone">
        <div class="hint">
          여기에 게임 스크린샷 드래그 드롭<br>
          <small>또는 클릭하여 파일 선택</small>
        </div>
        <input type="file" id="file-input" accept="image/*" style="display:none;">
        <canvas id="overlay-canvas" style="display:none;"></canvas>
      </div>
      <div id="status" class="status-bar">이미지 대기 중…</div>
    </div>

    <div class="controls-pane">
      <h2>HSV 임계값 튜닝</h2>

      <div class="group" data-elem="hp">
        <div class="group-title">HP 바 (빨강) <span class="badge fail" id="badge-hp">미탐지</span></div>
        <div class="slider-row"><label>hueMin</label><input type="range" min="0" max="360" value="355" data-key="hueMin"><span class="val">355</span></div>
        <div class="slider-row"><label>hueMax</label><input type="range" min="0" max="360" value="5" data-key="hueMax"><span class="val">5</span></div>
        <div class="slider-row"><label>satMin</label><input type="range" min="0" max="100" value="70" data-key="satMin"><span class="val">0.70</span></div>
        <div class="slider-row"><label>valMin</label><input type="range" min="0" max="100" value="70" data-key="valMin"><span class="val">0.70</span></div>
        <div class="slider-row"><label>minArea</label><input type="range" min="10" max="2000" value="100" data-key="minArea"><span class="val">100</span></div>
      </div>

      <div class="group" data-elem="mp">
        <div class="group-title">MP 바 (파랑) <span class="badge fail" id="badge-mp">미탐지</span></div>
        <div class="slider-row"><label>hueMin</label><input type="range" min="0" max="360" value="205" data-key="hueMin"><span class="val">205</span></div>
        <div class="slider-row"><label>hueMax</label><input type="range" min="0" max="360" value="225" data-key="hueMax"><span class="val">225</span></div>
        <div class="slider-row"><label>satMin</label><input type="range" min="0" max="100" value="30" data-key="satMin"><span class="val">0.30</span></div>
        <div class="slider-row"><label>valMin</label><input type="range" min="0" max="100" value="45" data-key="valMin"><span class="val">0.45</span></div>
        <div class="slider-row"><label>minArea</label><input type="range" min="10" max="2000" value="100" data-key="minArea"><span class="val">100</span></div>
      </div>

      <div class="group" data-elem="exp">
        <div class="group-title">EXP 바 (오렌지) <span class="badge fail" id="badge-exp">미탐지</span></div>
        <div class="slider-row"><label>hueMin</label><input type="range" min="0" max="360" value="15" data-key="hueMin"><span class="val">15</span></div>
        <div class="slider-row"><label>hueMax</label><input type="range" min="0" max="360" value="25" data-key="hueMax"><span class="val">25</span></div>
        <div class="slider-row"><label>satMin</label><input type="range" min="0" max="100" value="60" data-key="satMin"><span class="val">0.60</span></div>
        <div class="slider-row"><label>valMin</label><input type="range" min="0" max="100" value="60" data-key="valMin"><span class="val">0.60</span></div>
        <div class="slider-row"><label>minArea</label><input type="range" min="10" max="2000" value="50" data-key="minArea"><span class="val">50</span></div>
      </div>

      <div class="group" data-elem="adena">
        <div class="group-title">ADENA (노랑) <span class="badge fail" id="badge-adena">미탐지</span></div>
        <div class="slider-row"><label>hueMin</label><input type="range" min="0" max="360" value="45" data-key="hueMin"><span class="val">45</span></div>
        <div class="slider-row"><label>hueMax</label><input type="range" min="0" max="360" value="55" data-key="hueMax"><span class="val">55</span></div>
        <div class="slider-row"><label>satMin</label><input type="range" min="0" max="100" value="55" data-key="satMin"><span class="val">0.55</span></div>
        <div class="slider-row"><label>valMin</label><input type="range" min="0" max="100" value="45" data-key="valMin"><span class="val">0.45</span></div>
        <div class="slider-row"><label>minArea</label><input type="range" min="10" max="2000" value="20" data-key="minArea"><span class="val">20</span></div>
      </div>

      <button class="action" id="btn-redetect">🔄 재탐지 (full pipeline)</button>
      <button class="action" id="btn-reset">↺ 기본값 복원</button>

      <h2>탐지 결과 JSON</h2>
      <pre class="json" id="result-json">대기 중…</pre>
    </div>
  </div>

  <script src="../js/roi-detector.js"></script>
  <script>
  (function () {
    'use strict';

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');
    const overlay = document.getElementById('overlay-canvas');
    const statusEl = document.getElementById('status');
    const resultJson = document.getElementById('result-json');
    const btnRedetect = document.getElementById('btn-redetect');
    const btnReset = document.getElementById('btn-reset');

    let currentImage = null;
    let workCanvas = document.createElement('canvas');
    let workCtx = workCanvas.getContext('2d');
    let debounceTimer = null;

    const ELEMENT_COLORS = {
      hp: '#ff3333',
      mp: '#3399ff',
      exp: '#ff9933',
      adena: '#ffdd33'
    };

    const DEFAULTS = {
      hp:    { hueMin: 355, hueMax: 5,   satMin: 70, valMin: 70, minArea: 100 },
      mp:    { hueMin: 205, hueMax: 225, satMin: 30, valMin: 45, minArea: 100 },
      exp:   { hueMin: 15,  hueMax: 25,  satMin: 60, valMin: 60, minArea: 50  },
      adena: { hueMin: 45,  hueMax: 55,  satMin: 55, valMin: 45, minArea: 20  }
    };

    // ===== 슬라이더 라벨 갱신 =====
    function updateSliderLabel(input) {
      const key = input.dataset.key;
      const valEl = input.parentElement.querySelector('.val');
      const v = parseFloat(input.value);
      if (key === 'satMin' || key === 'valMin') valEl.textContent = (v / 100).toFixed(2);
      else valEl.textContent = String(v);
    }

    // ===== 모든 슬라이더 → 파라미터 객체 =====
    function readParams() {
      const result = {};
      for (const elem of ['hp', 'mp', 'exp', 'adena']) {
        const group = document.querySelector('.group[data-elem="' + elem + '"]');
        const params = {};
        for (const input of group.querySelectorAll('input[type=range]')) {
          const key = input.dataset.key;
          let v = parseFloat(input.value);
          if (key === 'satMin' || key === 'valMin') v = v / 100;
          params[key] = v;
        }
        result[elem] = params;
      }
      return result;
    }

    function setSliderDefaults() {
      for (const elem of Object.keys(DEFAULTS)) {
        const group = document.querySelector('.group[data-elem="' + elem + '"]');
        const def = DEFAULTS[elem];
        for (const input of group.querySelectorAll('input[type=range]')) {
          input.value = def[input.dataset.key];
          updateSliderLabel(input);
        }
      }
    }

    // ===== 이미지 로드 =====
    function loadImage(src) {
      const img = new Image();
      img.onload = () => {
        currentImage = img;
        workCanvas.width = img.width;
        workCanvas.height = img.height;
        workCtx.drawImage(img, 0, 0);
        runDetection();
      };
      img.src = src;
    }

    function handleFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = (e) => loadImage(e.target.result);
      reader.readAsDataURL(file);
    }

    // ===== 탐지 + 오버레이 그리기 =====
    function runDetection() {
      if (!currentImage) return;
      const params = readParams();
      const w = workCanvas.width;
      const h = workCanvas.height;
      const imageData = workCtx.getImageData(0, 0, w, h);

      // 슬라이더 파라미터로 직접 4개 요소 탐지 (custom posFilter)
      const findWith = (elem, posFilter) => {
        const p = params[elem];
        return RoiDetector.findColorBlobs(imageData, {
          hueMin: p.hueMin, hueMax: p.hueMax,
          satMin: p.satMin, valMin: p.valMin,
          minArea: p.minArea, posFilter
        });
      };

      const hpBlobs = findWith('hp', (x, y, bw, bh) =>
        y >= h * 0.65 && bw / Math.max(1, bh) > 3
      );
      const hpBar = hpBlobs[0] || null;

      const mpBlobs = hpBar
        ? findWith('mp', (x, y, bw, bh) =>
            y >= hpBar.y - 30 && y <= hpBar.y + hpBar.height + 30 &&
            x >= hpBar.x + hpBar.width + Math.floor(w * 0.04) &&
            bw / Math.max(1, bh) > 3
          )
        : findWith('mp', () => true);
      const mpBar = mpBlobs[0] || null;

      const expBlobs = findWith('exp', (x, y, bw, bh) =>
        x <= w * 0.20 && y >= h * 0.76 && y <= h * 0.88 &&
        bw / Math.max(1, bh) >= 2
      );
      const expBar = expBlobs[0] || null;

      const adenaBlobs = findWith('adena', (x, y, bw, bh) => {
        if (x < w * 0.85 || y < h * 0.90) return false;
        const ar = bw / Math.max(1, bh);
        return ar >= 0.6 && ar <= 1.5;
      });
      const adenaIcon = adenaBlobs[0] || null;

      const anchors = { hpBar, mpBar, expBar, adenaIcon };
      const textROIs = RoiDetector.deriveTextROIs(anchors, w, h);
      const validation = RoiDetector.validateROIs(textROIs, anchors, w, h);
      const result = { anchors, textROIs, valid: validation.valid, issues: validation.issues };

      drawOverlay(anchors, textROIs);
      updateBadges(anchors);
      updateStatus(result);
      resultJson.textContent = JSON.stringify(result, null, 2);
    }

    function drawOverlay(anchors, textROIs) {
      overlay.style.display = 'block';
      dropzone.classList.add('has-image');
      const w = workCanvas.width;
      const h = workCanvas.height;
      overlay.width = w;
      overlay.height = h;
      const ctx = overlay.getContext('2d');
      ctx.drawImage(workCanvas, 0, 0);

      const drawBox = (box, color, label, dashed) => {
        if (!box) return;
        ctx.strokeStyle = color;
        ctx.lineWidth = dashed ? 1 : 2;
        ctx.setLineDash(dashed ? [4, 4] : []);
        ctx.strokeRect(box.x + 0.5, box.y + 0.5, box.width, box.height);
        if (label) {
          ctx.setLineDash([]);
          ctx.fillStyle = color;
          ctx.font = 'bold 12px Consolas, monospace';
          ctx.fillText(label, box.x + 2, box.y - 2 < 12 ? box.y + 12 : box.y - 2);
        }
      };

      drawBox(anchors.hpBar,     ELEMENT_COLORS.hp,    'HP', false);
      drawBox(anchors.mpBar,     ELEMENT_COLORS.mp,    'MP', false);
      drawBox(anchors.expBar,    ELEMENT_COLORS.exp,   'EXP', false);
      drawBox(anchors.adenaIcon, ELEMENT_COLORS.adena, 'ADENA', false);

      drawBox(textROIs.mp,    ELEMENT_COLORS.mp,    null, true);
      drawBox(textROIs.exp,   ELEMENT_COLORS.exp,   'exp-text', true);
      drawBox(textROIs.level, ELEMENT_COLORS.exp,   'lvl', true);
      drawBox(textROIs.adena, ELEMENT_COLORS.adena, null, true);
    }

    function updateBadges(anchors) {
      const set = (id, ok) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = ok ? '탐지됨' : '미탐지';
        el.className = 'badge ' + (ok ? 'ok' : 'fail');
      };
      set('badge-hp', !!anchors.hpBar);
      set('badge-mp', !!anchors.mpBar);
      set('badge-exp', !!anchors.expBar);
      set('badge-adena', !!anchors.adenaIcon);
    }

    function updateStatus(result) {
      if (result.valid) {
        statusEl.textContent = '✓ 모든 ROI 유효';
        statusEl.className = 'status-bar valid';
      } else {
        statusEl.textContent = '⚠ ' + (result.issues.join(' · ') || '탐지 실패');
        statusEl.className = 'status-bar invalid';
      }
    }

    // ===== 이벤트 바인딩 =====
    function debouncedDetect() {
      if (debounceTimer) clearTimeout(debounceTimer);
      debounceTimer = setTimeout(runDetection, 100);
    }

    document.querySelectorAll('input[type=range]').forEach((input) => {
      input.addEventListener('input', () => {
        updateSliderLabel(input);
        debouncedDetect();
      });
    });

    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      if (e.target.files[0]) handleFile(e.target.files[0]);
    });
    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.style.borderColor = '#7fff7f';
    });
    dropzone.addEventListener('dragleave', () => {
      dropzone.style.borderColor = '';
    });
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.style.borderColor = '';
      if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });

    btnRedetect.addEventListener('click', runDetection);
    btnReset.addEventListener('click', () => {
      setSliderDefaults();
      runDetection();
    });

    // 초기화
    document.querySelectorAll('input[type=range]').forEach(updateSliderLabel);
  })();
  </script>
</body>
</html>
